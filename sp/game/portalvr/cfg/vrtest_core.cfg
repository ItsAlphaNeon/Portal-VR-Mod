// Close-up of the gun from the side: clear glass, glowing core, glow sprite (blue then orange).
sv_cheats 1
vr_seated 1
vr_debug_fake_hands 1
vr_debug_fake_hand_yaw 90
vr_debug_fake_hand_forward 20
vr_gun_x 0
vr_gun_y 0
vr_gun_z 6
vr_gun_pitch 0
vr_gun_yaw 0
vr_gun_roll 0
vr_show_controllers 0
give weapon_portalgun
vr_after 2.0 +attack
