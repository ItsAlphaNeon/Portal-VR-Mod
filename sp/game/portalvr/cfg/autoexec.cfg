// Portal VR: make the Portal-Base game code behave like the original Portal.
sv_use_portal_gamerules 1		// Portal gamerules: no fall damage (long fall boots)
sv_regeneration_enable 1		// Portal's health regeneration
cl_playermodel "models/player/chell.mdl"
portal_vanilla_gameplay 1		// no reload-to-fizzle, no click-speed refire
sv_portal_projectile_delay 999		// portal opens after the original distance-based delay
sv_portalgun_deploy_mode 1
allow_portalgun_lowering_anim 0
beta_quickinfo 0
max_lift_mass 85			// Portal's no-weapon lift limit (HL2's 35 can't lift the 40 kg cube)

// Portal VR: saved gun placement (written by vr_gun_calibrate)
exec vr_gun_calibration.cfg
exec vr_gun_beam.cfg
