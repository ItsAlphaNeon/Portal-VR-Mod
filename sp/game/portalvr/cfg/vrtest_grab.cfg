// Picking up without the portal gun (testchmb_a_00): bring the cube in front, press grab, look up. Waits out the wake-up intro (the player is frozen).
sv_cheats 1
vr_seated 1
vr_test_cfg ""
vr_debug_fake_hands 1
vr_gun_x 0
vr_gun_y 0
vr_gun_z 0
vr_gun_pitch 0
vr_gun_yaw 0
vr_gun_roll 0
vr_gun_aim_pitch 0
vr_gun_aim_yaw 0
