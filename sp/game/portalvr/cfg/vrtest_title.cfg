// Title screen in VR: black room, the menu screen showing the flat flyby view under the menu.
// Launch without a map (the background map runs this after it spawns the player).
vr_seated 1
vr_test_cfg ""
vr_after 2.0 vr_dump_eyes title_a
vr_after 6.0 vr_dump_eyes title_b
vr_after 6.5 echo VRTEST_DONE
